<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Inventory at five distribution centres, split into the buffer that protects against disruption and the excess that is only cost">
<title>Inventory at five distribution centres, split into the buffer that protects against disruption and the excess that is only cost</title>
<defs>
<marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d08a57"/></marker>
<marker id="ahl" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e3b48f"/></marker>
<marker id="ahg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b7680"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#2a323a"/><line x1="0" y1="0" x2="0" y2="8" stroke="#6b7680" stroke-width="2"/></pattern></defs>
<rect width="480" height="300" fill="#1d2329"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="24" y="22" width="12" height="12" fill="#d08a57"/><text x="42" y="33" font-size="12" fill="#f3efe9">Protects against disruption</text>
<rect x="232" y="22" width="12" height="12" fill="url(#hatch)" stroke="#6b7680"/><text x="250" y="33" font-size="12" fill="#f3efe9">Just cost — absorbs noise</text>
<rect x="58" y="100" width="52" height="78" fill="url(#hatch)" stroke="#6b7680"/><rect x="58" y="178" width="52" height="72" fill="#d08a57"/><text x="84" y="272" font-size="12" fill="#9aa1a8" text-anchor="middle">DC 1</text><rect x="138" y="140" width="52" height="28" fill="url(#hatch)" stroke="#6b7680"/><rect x="138" y="168" width="52" height="82" fill="#d08a57"/><text x="164" y="272" font-size="12" fill="#9aa1a8" text-anchor="middle">DC 2</text><rect x="218" y="75" width="52" height="111" fill="url(#hatch)" stroke="#6b7680"/><rect x="218" y="186" width="52" height="64" fill="#d08a57"/><text x="244" y="272" font-size="12" fill="#9aa1a8" text-anchor="middle">DC 3</text><rect x="298" y="155" width="52" height="17" fill="url(#hatch)" stroke="#6b7680"/><rect x="298" y="172" width="52" height="78" fill="#d08a57"/><text x="324" y="272" font-size="12" fill="#9aa1a8" text-anchor="middle">DC 4</text><rect x="378" y="115" width="52" height="67" fill="url(#hatch)" stroke="#6b7680"/><rect x="378" y="182" width="52" height="68" fill="#d08a57"/><text x="404" y="272" font-size="12" fill="#9aa1a8" text-anchor="middle">DC 5</text>
<line x1="40" y1="250" x2="440" y2="250" stroke="#4a5560"/>
<line x1="40" y1="176" x2="440" y2="176" stroke="#e3b48f" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="24" y1="52" x2="38" y2="52" stroke="#e3b48f" stroke-width="1.5" stroke-dasharray="4 3"/><text x="42" y="56" font-size="12" fill="#f3efe9">Buffer actually needed</text>
</g>
</svg>
