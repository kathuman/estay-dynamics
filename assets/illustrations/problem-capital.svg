<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Uncertain demand fans out over time; building full scale now leaves idle capacity, while staged expansion adds capacity at demand triggers">
<title>Uncertain demand fans out over time; building full scale now leaves idle capacity, while staged expansion adds capacity at demand triggers</title>
<defs>
