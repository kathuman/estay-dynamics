<marker id="ahl" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e3b48f"/></marker>
<marker id="ahg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b7680"/></marker>
</defs>
<rect width="480" height="300" fill="#1d2329"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<path d="M40 200 L440 92 L440 250 Z" fill="#2a323a"/>
<path d="M40 200 L440 92 M40 200 L440 250" stroke="#6b7680" stroke-dasharray="4 4"/>
<path d="M40 200 L440 170" stroke="#9aa1a8" stroke-width="1.6" stroke-dasharray="6 4"/>
