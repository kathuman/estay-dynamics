<text x="440" y="62" font-size="11" fill="#9aa1a8" text-anchor="end">build full scale now</text>
<text x="300" y="120" font-size="11" fill="#d08a57">stage and expand</text>
<text x="156" y="156" font-size="11" fill="#e3b48f">trigger</text>
