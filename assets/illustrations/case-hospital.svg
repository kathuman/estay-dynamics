<marker id="ahg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b7680"/></marker>
</defs>
<rect width="480" height="300" fill="#1d2329"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<g fill="none" stroke="#6b7680" stroke-width="1.5"><circle cx="46" cy="80" r="9"/><circle cx="60" cy="75" r="10"/><circle cx="62" cy="87" r="8"/></g><g fill="none" stroke="#6b7680" stroke-width="1.5"><circle cx="418" cy="80" r="9"/><circle cx="432" cy="75" r="10"/><circle cx="434" cy="87" r="8"/></g><g fill="none" stroke="#6b7680" stroke-width="1.5"><circle cx="46" cy="210" r="9"/><circle cx="60" cy="205" r="10"/><circle cx="62" cy="217" r="8"/></g><g fill="none" stroke="#6b7680" stroke-width="1.5"><circle cx="418" cy="210" r="9"/><circle cx="432" cy="205" r="10"/><circle cx="434" cy="217" r="8"/></g>
