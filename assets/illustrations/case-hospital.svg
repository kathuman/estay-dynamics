<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Stock-and-flow sketch: beds in service and the cleaning workforce are sized to the same throughput signal, but hiring adds staff only after a delay">
<title>Stock-and-flow sketch: beds in service and the cleaning workforce are sized to the same throughput signal, but hiring adds staff only after a delay</title>
