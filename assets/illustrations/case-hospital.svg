<text x="356" y="60" font-size="11" fill="#9aa1a8" text-anchor="middle">beds ordered</text>
<text x="122" y="244" font-size="11" fill="#9aa1a8" text-anchor="middle">hiring</text>
<text x="356" y="244" font-size="11" fill="#9aa1a8" text-anchor="middle">attrition</text>
<path d="M114 186 L130 181 M114 194 L130 189" stroke="#f3efe9" stroke-width="1.6"/>
