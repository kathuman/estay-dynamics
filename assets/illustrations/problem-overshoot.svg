<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="After a 20% demand step, production overshoots; of 215 units above demand, 140 are necessary refill, 59 come from decision rules and only 16 from the forecast">
<title>After a 20% demand step, production overshoots; of 215 units above demand, 140 are necessary refill, 59 come from decision rules and only 16 from the forecast</title>
<defs>
<marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d08a57"/></marker>
<marker id="ahl" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e3b48f"/></marker>
<marker id="ahg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b7680"/></marker>
</defs>
<rect width="480" height="300" fill="#1d2329"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text x="40" y="34" font-size="12" fill="#9aa1a8">After a 20% demand step</text>
<line x1="40" y1="172" x2="440" y2="172" stroke="#4a5560"/>
<path d="M40 150 L150 150 L150 118 L440 118" fill="none" stroke="#9aa1a8" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M40 150 L150 150 C 185 150, 196 54, 232 54 C 266 54, 284 124, 312 120 C 344 116, 380 118, 440 118" fill="none" stroke="#d08a57" stroke-width="2.6"/>
<text x="248" y="48" font-size="11" fill="#d08a57">production</text>
<text x="440" y="110" font-size="11" fill="#9aa1a8" text-anchor="end">demand</text>
<text x="40" y="204" font-size="12" fill="#f3efe9">215 units produced above demand</text>
<rect x="40" y="214" width="260" height="26" fill="#e3b48f"/><rect x="300" y="214" width="110" height="26" fill="#d08a57"/><rect x="410" y="214" width="30" height="26" fill="#e0806a"/>
<g font-size="11"><text x="40" y="260" fill="#e3b48f">Refill 140 · 65%</text><text x="300" y="260" fill="#d08a57" text-anchor="middle">Rules 59 · 28%</text><text x="440" y="260" fill="#e0806a" text-anchor="end">Forecast 16 · 7%</text></g>
<text x="40" y="286" font-size="11" fill="#9aa1a8">Example from Lag Lab</text>
</g>
</svg>
